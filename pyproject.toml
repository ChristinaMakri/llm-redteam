[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated red-teaming framework for prompt-level attacks against LangGraph agents"
requires-python = ">=3.12"
dependencies = [
    "langgraph-sdk>=0.1.0",
    "langchain-openai>=0.2.0",
    "azure-identity>=1.25.1",
    "openai>=1.0.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redteam"]

[tool.ruff]
target-version = "py312"
line-length = 120
